build.dir=build
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.generated.dir=${build.dir}/generated-sources
build.generated.sources.dir=${build.dir}/generated-sources
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
build.sysclasspath=ignore
buildfile=build.xml
debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
dist.dir=dist
dist.jar=${dist.dir}/LibraryBookBorrowingSystem.jar
excludes=
file.reference.flatlaf-3.6.2.jar=lib/flatlaf-3.6.2.jar
file.reference.sqlite-jdbc-3.53.4.0.jar=lib/sqlite-jdbc-3.53.4.0.jar
includes=**
javac.classpath=\
    ${file.reference.flatlaf-3.6.2.jar}:\
    ${file.reference.sqlite-jdbc-3.53.4.0.jar}
javac.compilerargs=
javac.deprecation=false
javac.modulepath=
javac.processormodulepath=
javac.source=17
javac.target=17
javac.test.classpath=${javac.classpath}:${build.classes.dir}
javac.test.compilerargs=
javac.test.failure.ignore=false
javac.test.modulepath=\
    ${javac.modulepath}
main.class=library.Main
meta.inf.dir=${src.dir}/META-INF
platform.active=default_platform
run.classpath=${javac.classpath}:${build.classes.dir}
run.jvmargs=--enable-native-access=ALL-UNNAMED
run.modulepath=\
    ${javac.modulepath}
run.test.modulepath=\
    ${javac.test.modulepath}
src.dir=src
resources.dir=resources
test.src.dir=test
